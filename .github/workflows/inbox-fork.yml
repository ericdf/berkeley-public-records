name: inbox (fork)
# The inbox robot for pull requests from forks. A fork's pull request gets a read-only token in
# inbox.yml, so this runs on pull_request_target instead: the workflow file and every script it
# runs come from main, never from the pull request.
#
# Two jobs, so nothing that can push ever reads a contributor's file:
#   process  read-only token. Fetches the pull request as data; tools/fork_inbox.py copies across
#            only plain files directly in inbox/; main's process_inbox.py (pdftotext),
#            validate.py and tests run. The result leaves as a patch artifact.
#   publish  write token. Applies the patch to main, checks that it only adds plain files under
#            L0/, L1/, T0/ or manifest/ (fork_inbox.py --check-staged), re-runs validate.py, and
#            pushes inbox-fork/pr-<number> with a pull request of its own for the maintainer.
#            The contributor's pull request gets the comment; inbox-fork-close.yml closes it when
#            the processed one is merged. Each push to the fork's branch reprocesses.
on:
  pull_request_target:
    types: [opened, synchronize, reopened]
    paths: ['inbox/**']
permissions: {}
concurrency:
  group: inbox-fork-${{ github.event.pull_request.number }}
  cancel-in-progress: true
env:
  PR: ${{ github.event.pull_request.number }}
  HEAD_SHA: ${{ github.event.pull_request.head.sha }}
  AUTHOR: ${{ github.event.pull_request.user.login }}
  AUTHOR_ID: ${{ github.event.pull_request.user.id }}
  BRANCH: inbox-fork/pr-${{ github.event.pull_request.number }}
jobs:
  process:
    if: github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      gate: ${{ steps.gate.outcome }}
      process: ${{ steps.process.outcome }}
      validate: ${{ steps.validate.outcome }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false
      - name: Fetch the pull request as data
        run: |
          git fetch --no-tags origin "+refs/pull/$PR/head:refs/remotes/pr/head"
          if [ "$(git rev-parse refs/remotes/pr/head)" != "$HEAD_SHA" ]; then
            echo "The pull request moved on while this ran; the newer run handles it."; exit 1
          fi
      - name: Install pdftotext
        run: sudo apt-get update -q && sudo apt-get install -y -q poppler-utils
      - name: Take only the inbox files
        id: gate
        continue-on-error: true
        run: |
          mkdir -p out
          python3 tools/fork_inbox.py --base HEAD --head refs/remotes/pr/head --apply --summary-file out/summary.md
      - name: Process inbox
        id: process
        if: steps.gate.outcome == 'success'
        continue-on-error: true
        run: python3 tools/process_inbox.py --contributor "$AUTHOR" --summary-file out/summary.md
      - name: Validate the final state
        id: validate
        if: steps.process.outcome == 'success'
        continue-on-error: true
        run: |
          set -o pipefail
          { python3 tools/validate.py && python3 -m unittest discover -s tests; } 2>&1 | tee out/validate.txt
      - name: Write the result as a patch
        if: steps.validate.outcome == 'success'
        run: |
          git add -A -- . ':!out'
          git diff --cached --binary > out/processed.patch
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: inbox-fork-${{ github.event.pull_request.number }}
          path: out/
          retention-days: 7

  publish:
    needs: process
    if: always() && needs.process.result != 'skipped' && needs.process.result != 'cancelled'
    runs-on: ubuntu-latest
    permissions:
      contents: write        # push the processed branch here
      pull-requests: write   # open the processed pull request; comment on the contributor's
      statuses: write        # mark the processed commit validated
    env:
      GH_TOKEN: ${{ github.token }}
      GATE: ${{ needs.process.outputs.gate }}
      PROCESS: ${{ needs.process.outputs.process }}
      VALIDATE: ${{ needs.process.outputs.validate }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false
      - uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: inbox-fork-${{ github.event.pull_request.number }}
          path: ${{ runner.temp }}/in
      - name: Apply, check, push, and open the processed pull request
        id: publish
        if: env.VALIDATE == 'success'
        run: |
          IN="$RUNNER_TEMP/in"
          git -c core.hooksPath=/dev/null switch -q -c "$BRANCH"
          git apply --index --binary --whitespace=nowarn "$IN/processed.patch"
          python3 tools/fork_inbox.py --check-staged
          python3 tools/validate.py
          IDS=$(git diff --cached --name-only --diff-filter=A -- manifest/ \
                | sed 's|manifest/||; s|\.json$||' | { grep -v -- '-text$' || true; } | paste -sd, - | sed 's/,/, /g')
          printf 'Process inbox from #%s: %s\n\nCo-authored-by: %s <%s+%s@users.noreply.github.com>\n' \
            "$PR" "$IDS" "$AUTHOR" "$AUTHOR_ID" "$AUTHOR" > "$RUNNER_TEMP/msg.txt"
          git -c core.hooksPath=/dev/null -c user.name="github-actions[bot]" \
              -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
              commit -q -F "$RUNNER_TEMP/msg.txt"
          git -c core.hooksPath=/dev/null push --force \
              "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "HEAD:refs/heads/$BRANCH"
          # Pushes made with this token start no workflows, so record the validation just run.
          gh api "repos/$GITHUB_REPOSITORY/statuses/$(git rev-parse HEAD)" \
            -f state=success -f context="inbox / validate (processed commit)" \
            -f description="validate.py and tests passed on this commit" > /dev/null
          N=$(gh pr list --repo "$GITHUB_REPOSITORY" --head "$BRANCH" --state open --json number --jq '.[0].number // empty')
          if [ -z "$N" ]; then
            printf 'Processed from #%s, contributed by @%s, by the inbox robot (`.github/workflows/inbox-fork.yml`).\n\nAdds: %s\n\nMerging this closes #%s.\n' \
              "$PR" "$AUTHOR" "$IDS" "$PR" > "$RUNNER_TEMP/body.md"
            N=$(gh pr create --repo "$GITHUB_REPOSITORY" --base main --head "$BRANCH" \
                  --title "Inbox from #$PR: $IDS" --body-file "$RUNNER_TEMP/body.md" | sed 's|.*/||') || N=""
          fi
          echo "pr=$N" >> "$GITHUB_OUTPUT"
      - name: Comment on the contributor's pull request
        if: always()
        env:
          PUBLISHED: ${{ steps.publish.outcome }}
          PROCESSED: ${{ steps.publish.outputs.pr }}
        run: |
          IN="$RUNNER_TEMP/in"
          {
            cat "$IN/summary.md" 2>/dev/null || echo "The inbox step did not run to completion; see the workflow log."
            if [ "$VALIDATE" = "failure" ]; then
              echo; echo "**Validation failed after processing, so nothing was kept.** The maintainer will look at it. Output:"
              echo; echo '```'; tail -n 40 "$IN/validate.txt" 2>/dev/null; echo '```'
            fi
            if [ "$PUBLISHED" = "success" ]; then
              echo
              if [ -n "$PROCESSED" ]; then
                echo "The processed files are in #$PROCESSED, which the maintainer reviews and merges; this pull request closes when it is merged. To change anything, push to your branch again and both update."
              else
                echo "The processed files are on the branch \`$BRANCH\`. The robot could not open its pull request; the maintainer will."
              fi
            elif [ "$PUBLISHED" = "failure" ]; then
              echo; echo "**The processed files could not be saved.** The maintainer will look at it."
            fi
          } > "$RUNNER_TEMP/comment.md"
          gh pr comment "$PR" --repo "$GITHUB_REPOSITORY" --body-file "$RUNNER_TEMP/comment.md"
      - name: Fail if anything failed
        if: env.GATE != 'success' || env.PROCESS != 'success' || env.VALIDATE != 'success' || steps.publish.outcome == 'failure'
        run: exit 1
